services:
  backend:
    build: .
    container_name: udaan-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GEMINI_MODEL: gemini-2.5-flash-lite
      GEMINI_MODELS: gemini-2.5-flash-lite,gemini-2.5-flash,gemini-2.0-flash
      GEMINI_TIMEOUT_SECONDS: 12
    restart: unless-stopped
